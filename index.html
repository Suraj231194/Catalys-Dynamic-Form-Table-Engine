<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FormTablePro — A configuration-driven React application with dynamic form rendering and data table management. Built with React 19, TypeScript, TailwindCSS, and TanStack Table." />
    <meta name="theme-color" content="#ffffff" id="meta-theme" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%236366f1'/%3E%3Cpath d='M30 30h15v15H30zM55 30h15v15H55zM30 55h15v15H30zM55 55h15v15H55z' fill='white'/%3E%3C/svg%3E" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var root = document.documentElement;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (theme === 'dark') {
            root.classList.add('dark');
            if (meta) meta.setAttribute('content', '#020617');
          } else {
            root.classList.remove('dark');
            if (meta) meta.setAttribute('content', '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>FormTablePro — Dynamic Form & Table Engine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
